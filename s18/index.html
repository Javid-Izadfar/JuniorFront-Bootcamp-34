<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-neutral-800 text-white">
    <main class="mx-auto grid max-w-7xl grid-cols-1 gap-4 px-4 pb-8 pt-8 xl:px-0">
      <!-- weather -->
      <section class="flex min-h-44 items-center justify-between rounded-2xl bg-neutral-700 px-4 py-4">
        <div class="flex flex-col justify-between self-stretch">
          <div>
            <h1 class="text-3xl font-normal leading-8">Hello Jay</h1>
            <p class="text-xs text-white/40">Today is mostly sunny</p>
          </div>
          <div>
            <p class="text-3xl font-normal leading-8">29°C</p>
            <p class="text-xs text-white/40">Tehran, Iran</p>
          </div>
        </div>
        <img
          class="w-32 -mr-2"
          src="images/sun_and_cloud.png"
          alt="Sun behind a cloud"
        />
      </section>

      <!-- task list -->
      <section class="rounded-2xl bg-neutral-700 px-4 py-4">
        <h2 class="text-2xl font-normal leading-8">Tuesday, 11 Jun</h2>
        <p class="text-xs text-white/40">Today's agenda</p>
        <ul class="mt-4 flex flex-col gap-1.5">
          <li class="border-l-4 border-amber-400 py-1 pl-3">
            <p class="text-base">BB Daily</p>
            <p class="text-xs text-white/40">10:30, Head Office</p>
          </li>
          <li class="border-l-4 border-emerald-400 py-1 pl-3">
            <p class="text-base">CodingFront - S10</p>
            <p class="text-xs text-white/40">18:00, Google Meet</p>
          </li>
        </ul>
      </section>

    </main>
  </body>
</html>
