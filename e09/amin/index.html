<html lang="fa" dir="rtl">
  <head>
    <link rel="stylesheet" href="assets/styles/index.css" />
  </head>
  <body>
    <header class="header">
      <div class="container flex justify-between align-center">
        <a href="#" title="صفحه اصلی">
          <img
            src="assets/images/Logo.svg"
            width="108px"
            height="40px"
            alt="لوگوی آیسی دانکی"
          />
        </a>
        <div class="flex align-center nav">
          <a href="#" title="خانه">خانه</a>
          <a href="#" title="طعم‌ها">طعم‌ها</a>
          <a href="#" title="فروشگاه‌ها">فروشگاه‌ها</a>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-inner">
          <h1 class="hero-title">آیسی دانکی</h1>
          <div class="flex justify-between hero-row">
            <div class="hero-side">
              <p class="hero-slogan">هر روز، آبمیوه تازه</p>
              <a
                class="flex align-center justify-center buy-btn"
                href="#"
                title="فروشگاه‌ها"
              >
                <img
                  src="assets/images/shop.svg"
                  width="24px"
                  height="24px"
                  alt="سبد خرید"
                />
                <span>همین الان بخر</span>
              </a>
            </div>
            <div class="hero-photo">
              <img
                class="layer layer-circle"
                src="assets/images/hero.svg"
                alt=""
              />
              <img
                class="layer layer-lemon-bg"
                src="assets/images/lemon.png"
                alt="lemon"
              />
              <img
                class="layer layer-lime"
                src="assets/images/lime.png"
                alt="lime"
              />
              <img
                class="layer layer-bottle"
                src="assets/images/bottle.png"
                alt="bottle"
              />
              <img
                class="layer layer-mint"
                src="assets/images/mint.png"
                alt="mint"
              />
              <img
                class="layer layer-kiwi"
                src="assets/images/kiwi.png"
                alt="kiwi"
              />
              <img
                class="layer layer-lemon-wedge"
                src="assets/images/lemonwedge.png"
                alt="lemon"
              />
            </div>
               <ul class="flex column features">
            <li class="feature flex align-start">
              <span class="feature-icon flex justify-center align-center">
                <img src="assets/images/drug.svg" width="32px" height="32px" alt="ویتامین" />
              </span>
              <div class="feature-body">
                <span class="feature-title">ویتامین</span>
                <p class="feature-text">
                  میزان مصرف ویتامین توی<br />
                  رژیم غذاییت رو افزایش بده
                </p>
              </div>
            </li>
            <li class="feature flex align-start">
              <span class="feature-icon flex justify-center align-center">
                <img src="assets/images/weight.svg" width="32px" height="32px" alt="کاهش وزن" />
              </span>
              <div class="feature-body">
                <span class="feature-title">کاهش وزن</span>
                <p class="feature-text">
                  با کم کردن مقدار شکر ورودی<br />
                  وزنت رو کم بکن
                </p>
              </div>
            </li>
            <li class="feature flex align-start">
              <span class="feature-icon flex justify-center align-center">
                <img src="assets/images/strenght.svg" width="32px" height="32px" alt="محافظت" />
              </span>
              <div class="feature-body">
                <span class="feature-title">محافظت</span>
                <p class="feature-text">
                  از الان جلوی پوکی استخوان<br />
                  در کهن‌سالیت رو بگیر
                </p>
              </div>
            </li>
            </ul>
          </div>
        </div>
      </section>
      <section class="flavors"></section>
      <section class="retailers"></section>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
