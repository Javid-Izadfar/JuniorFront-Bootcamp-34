<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>آیسی دانکی | آبمیوه تازه</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="m-0 min-w-[320px] bg-[#e6eaeb] text-[#040202] antialiased [font-family:Vazirmatn,sans-serif]"
  >
    <header class="sticky top-0 z-50 h-16 bg-[#e6eaeb]">
      <nav
        class="container mx-auto flex h-full w-[min(1200px,calc(100%_-_40px))] items-center justify-between"
        aria-label="ناوبری اصلی"
      >
        <a class="h-10 w-[108px] shrink-0" href="#home" title="صفحه اصلی">
          <img
            class="size-full"
            src="./assets/img/logo/logo.svg"
            alt="لوگوی آیسی دانکی"
            width="108"
            height="40"
          />
        </a>

        <div
          class="flex flex-row-reverse items-center gap-4 text-base font-medium whitespace-nowrap"
        >
          <a href="#shop" title="فروشگاه‌ها">فروشگاه‌ها</a>
          <a href="#flavors" title="طعم‌ها">طعم‌ها</a>
          <a href="#home" title="خانه">خانه</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="min-h-[814px] overflow-hidden" id="home">
        <div class="container relative mx-auto min-h-[814px] w-full max-w-[1266px] px-5 pt-[152px]">
          <!-- Main title -->
          <h1
            class="absolute left-0 top-[81px] z-10 whitespace-nowrap text-left text-[300px] leading-none text-[#346e16] [font-family:Lalezar,sans-serif]"
          >
            آیسی دانکی
          </h1>
          <div class="relative flex items-start justify-between gap-8">
            <!-- Text and purchase button -->
            <div class="mt-[241px] flex flex-col items-end gap-[50px]">
              <p class="m-0 whitespace-nowrap text-[28px] leading-[34px] text-black/40">
                هر روز، آبمیوه تازه
              </p>
              <a
                class="flex min-h-[58px] w-[204px] items-center justify-end gap-3 rounded-[30px] bg-[#040202] px-8 py-4 text-white"
                href="#shop"
                title="View stores"
              >
                <span class="whitespace-nowrap text-[18px] leading-[26px]"> همین الان بخر </span>
                <img
                  class="size-6 shrink-0"
                  src="./assets/img/header/shopping-cart.svg"
                  alt=""
                  width="24"
                  height="24"
                />
              </a>
            </div>

            <!-- Product features -->
            <ul class="mt-[241px] flex list-none flex-col gap-6 p-0">
              <li class="flex w-[238px] items-start gap-6">
                <span
                  class="flex size-[59px] shrink-0 items-center justify-center rounded-full bg-[#040202]"
                >
                  <img class="size-8" src="./assets/img/header/vitamins.svg" alt="" />
                </span>
                <div class="flex-1 text-right">
                  <h2 class="m-0 text-xl font-bold leading-[26px]">ویتامین</h2>
                  <p class="mt-px mb-0 text-xs leading-3 text-black/40">
                    میزان مصرف ویتامین توی<br />
                    رژیم غذاییت رو افزایش بده
                  </p>
                </div>
              </li>

              <li class="flex w-[238px] items-start gap-6">
                <span
                  class="flex size-[59px] shrink-0 items-center justify-center rounded-full bg-[#040202]"
                >
                  <img class="size-8" src="./assets/img/header/weight.svg" alt="" />
                </span>
                <div class="flex-1 text-right">
                  <h2 class="m-0 text-xl font-bold leading-[26px]">کاهش وزن</h2>

                  <p class="mt-px mb-0 text-xs leading-3 text-black/40">
                    با کم کردن مقدار شکر ورودی<br />
                    وزنت رو کم بکن
                  </p>
                </div>
              </li>

              <li class="flex w-[238px] items-start gap-6">
                <span
                  class="flex size-[59px] shrink-0 items-center justify-center rounded-full bg-[#040202]"
                >
                  <img class="size-8" src="./assets/img/header/strenght.svg" alt="" />
                </span>
                <div class="flex-1 text-right">
                  <h2 class="m-0 text-xl font-bold leading-[26px]">محافظت</h2>

                  <p class="mt-px mb-0 text-xs leading-3 text-black/40">
                    از الان جلوی پوکی استخوان<br />
                    در کهن‌سالیت رو بگیر
                  </p>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
