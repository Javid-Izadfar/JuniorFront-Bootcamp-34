<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Food</title>
  </head>
  <body>
    <section class="max-w-lg mx-auto p-6 text-center">
      <img src="./images/greek-salad.jpg" alt="Food" class="rounded-2xl" />
      <h1 class="text-2xl font-bold mt-6 text-gray-800">Special Food Menu</h1>
      <p class="text-sm text-gray-500 mt-3 leading-6">
        Discover our delicious food and enjoy a wonderful experience.
      </p>
      <div class="mt-8">
        <button
          class="w-full bg-yellow-400 text-gray-900 border-2 border-yellow-500 rounded-lg py-3 font-semibold"
        >
          Order Now
        </button>
        <button
          class="w-full bg-white text-gray-700 border-2 border-gray-300 rounded-lg py-3 font-semibold mt-3"
        >
          View Menu
        </button>
      </div>
    </section>
  </body>
</html>
