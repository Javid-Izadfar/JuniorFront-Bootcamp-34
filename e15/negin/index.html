<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body class="bg-orange-50">
    <div class="w-180 h-250 m-auto mt-20 bg-white rounded-2xl shadow-sm">
      <img
        src="assets/images/spaghetti.png"
        alt="spaghetti"
        class="rounded-t-2xl w-180 h-100 object-cover"
      />
      <div class="p-8">
        <h1 class="text-4xl font-bold mt-2">Spaghetti with shrimp sauce</h1>
        <div class="text-gray-600 text-xl mt-3">
          <span>30 min</span> &bull;
          <span class="text-green-500">Easy</span> &bull;
          <span class="text-green-500">524 kcal</span>
        </div>
        <p class="text-gray-600 text-3xl mt-9">
          A rich and creamy tomato sauce with succulent shrimp, served over al
          dente spaghetti. Perfect for a quick and delicious meal.
        </p>
        <a
          href="#"
          title="Go to Recipe"
          class="flex items-center justify-center mt-15 bg-yellow-400 rounded-2xl h-20 text-2xl tracking-wider font-semibold"
        >
          View the recipe
        </a>
      </div>
    </div>
  </body>
</html>
