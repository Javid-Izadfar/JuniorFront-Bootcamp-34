<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="w-full max-w-[360px] rounded-2xl bg-white shadow-lg">
      <div class="h-[180px]">
        <img
          src="assets/photo/hamer.png"
          alt="Spaghetti"
          title="hamber"
          class="w-full h-full object-contain"
        />
      </div>

      <div class="p-6">
        <h2 class="mb-3 text-xl font-bold text-gray-800">Spaghetti with shrimp sauce</h2>

        <p class="mb-6 text-sm leading-6 text-gray-500">
          Our shrimp sauce is made with mozzarella, a creamy taste of sauce with extra kick of
          spices.
        </p>

        <button class="mb-3 w-full rounded-xl bg-yellow-400 py-3 text-sm hover:bg-yellow-500">
          View On Foodies!
        </button>

        <button class="w-full py-3 text-sm text-gray-600 hover:text-yellow-500">
          Download App
        </button>
      </div>
    </div>
  </body>
</html>
