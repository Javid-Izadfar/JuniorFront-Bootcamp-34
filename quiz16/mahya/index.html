<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fernway - Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-white text-[#101828] dark:bg-[#030712] dark:text-white"
  >
    <main
      class="container mx-auto flex flex-col items-center justify-center px-5 py-10"
    >
      <div class="mb-8 flex items-center gap-3">
        <div
          class="flex h-12 w-12 items-center justify-center rounded-xl bg-[#4F46E5]"
        >
          <svg
            viewBox="0 0 32 32"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="h-10 w-10"
          >
            <path
              d="M10 22V16M10 16V10H22M10 16H18"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke="white"
            />
          </svg>
        </div>
        <h1 class="text-[28px] leading-[18px] font-bold max-sm:font-semibold">
          Fernway
        </h1>
      </div>
      <section
        class="w-full max-w-[512px] rounded-3xl border border-[#101828]/[0.05] bg-white p-8 dark:border-transparent dark:bg-[#101828]"
      >
        <h2 class="mb-6 text-[24px] font-bold leading-8">Sign in to Fernway</h2>
        <form>
          <div class="mb-6">
            <label for="email" class="mb-2 text-sm font-medium leading-5">
              Work email
            </label>
            <input
              type="email"
              id="email"
              placeholder="maya@ortizstudio.com"
              required
              shadow-[0_1px_2px_#1018280D,inset_0_1px_2px_#10182814]
              class="w-full rounded-lg border border-[#101828]/10 bg-white px-4 py-3 text-sm leading-5 text-[#101828] outline-none focus:border-[#4F46E5] focus:ring-2 focus:ring-[#4F46E5]/20 dark:border-white/20 dark:bg-[#101828] dark:text-white"
            />
          </div>
          <div class="mb-6">
            <label
              for="password"
              class="mb-2 block text-sm font-medium leading-5"
            >
              Password
            </label>
            <input
              type="password"
              id="password"
              placeholder="•••••"
              required
              shadow-[0_1px_2px_#1018280D,inset_0_1px_2px_#10182814]
              class="w-full rounded-lg border border-[#101828]/10 bg-white px-4 py-3 text-sm leading-5 text-[#101828] outline-none focus:border-[#4F46E5] focus:ring-2 focus:ring-[#4F46E5]/20 dark:border-white/20 dark:bg-[#101828] dark:text-white"
            />
          </div>
          <div class="mb-8 flex flex-wrap items-center justify-between gap-4">
            <label
              class="flex cursor-pointer items-center gap-2 text-sm font-semibold leading-5"
            >
              <input
                type="checkbox"
                checked
                class="h-4 w-4 cursor-pointer accent-black"
              />
              Remember me
            </label>
            <a
              href="#"
              class="text-sm font-medium leading-5 text-[#4F46E5] hover:underline"
            >
              Forgot password?
            </a>
          </div>
          <button
            type="submit"
            class="rounded-full bg-[#4F46E5] px-5 py-2 text-sm font-semibold leading-5 text-white transition hover:bg-[#4338CA]"
          >
            Sign in
          </button>
        </form>
      </section>
      <p
        class="mt-[23px] text-center text-sm leading-5 text-slate-500 dark:text-slate-300"
      >
        New to Fernway?
        <a href="#" class="font-medium text-[#4F46E5] hover:underline">
          Open an account
        </a>
      </p>
    </main>
  </body>
</html>
