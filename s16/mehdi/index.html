
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Fernway</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#f8f9fb] text-[#111827]">

  <main class="flex min-h-screen flex-col items-center px-5 py-10">

    <!-- Logo -->
    <div class="mb-10 flex items-center gap-4">

      <div class="flex size-14 items-center justify-center rounded-2xl bg-[#5141f5]">

        <img
          src="./assets/svg/logo.svg"
          alt="Fernway logo"
          title="Fernway logo"
          class="size-8 object-contain"
        >

      </div>

      <h1 class="text-3xl font-semibold tracking-tight">
        Fernway
      </h1>

    </div>

    <!-- Sign In Card -->
    <section class="w-full max-w-md rounded-3xl border border-gray-200 bg-white p-6 shadow-md sm:p-8">

      <h2 class="mb-8 text-3xl font-bold tracking-tight">
        Sign in to Fernway
      </h2>

      <form class="space-y-7">

        <!-- Email -->
        <div class="flex flex-col gap-2">

          <label
            for="email"
            class="text-lg font-medium text-gray-700"
          >
            Work email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            title="Work email"
            placeholder="maya@ortizstudio.com"
            autocomplete="email"
            required
            class="h-14 w-full rounded-xl border border-gray-300 bg-white px-4 text-base shadow-sm outline-none placeholder:text-gray-400 focus:border-[#5141f5] focus:ring-2 focus:ring-[#5141f5]/20"
          >

        </div>

        <!-- Password -->
        <div class="flex flex-col gap-2">

          <label
            for="password"
            class="text-lg font-medium text-gray-700"
          >
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            title="Password"
            placeholder="••••••"
            autocomplete="current-password"
            required
            class="h-14 w-full rounded-xl border border-gray-300 bg-white px-4 text-base shadow-sm outline-none placeholder:text-gray-400 focus:border-[#5141f5] focus:ring-2 focus:ring-[#5141f5]/20"
          >

        </div>

        <!-- Remember / Forgot -->
        <div class="flex flex-wrap items-center justify-between gap-3">

          <label class="flex cursor-pointer items-center gap-3 text-base font-medium">

            <input
              type="checkbox"
              name="remember"
              title="Remember me"
              checked
              class="size-5 accent-[#5141f5]"
            >

            Remember me

          </label>

          <a
            href="#"
            title="Forgot password"
            class="text-base font-medium text-[#5141f5]"
          >
            Forgot password?
          </a>

        </div>

        <!-- Submit -->
        <button
          type="submit"
          title="Sign in"
          class="h-14 rounded-full bg-[#5141f5] px-9 text-lg font-semibold text-white transition-colors hover:bg-[#4030dc] active:scale-[0.98]"
        >
          Sign in
        </button>

      </form>

    </section>

    <!-- Footer -->
    <p class="mt-8 text-center text-base text-gray-600">

      New to Fernway?

      <a
        href="#"
        title="Open an account"
        class="font-medium text-[#5141f5]"
      >
        Open an account
      </a>

    </p>

  </main>

</body>
</html>
