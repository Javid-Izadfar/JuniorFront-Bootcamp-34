<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cactus and Umbrella</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="container">
      <section class="card cactus-card">
        <div class="cactus">
          <div class="arm arm-left">
            <div class="arm-left-top"></div>
          </div>

          <div class="arm arm-right">
            <div class="arm-right-top"></div>
          </div>

          <div class="cactus-body"></div>
        </div>

        <div class="pot-rim"></div>
        <div class="pot"></div>
      </section>

      <section class="card umbrella-card">
        <div class="umbrella">
          <div class="canopy">
            <div class="canopy-pink canopy-left"></div>
            <div class="canopy-yellow"></div>
            <div class="canopy-pink canopy-right"></div>

            <div class="scallop scallop-left"></div>
            <div class="scallop scallop-middle"></div>
            <div class="scallop scallop-right"></div>
          </div>

          <div class="umbrella-stick"></div>
          <div class="umbrella-handle"></div>
        </div>
      </section>
    </main>
  </body>
</html>
