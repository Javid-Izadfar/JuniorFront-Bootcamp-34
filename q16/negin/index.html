<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Sign in</title>
  </head>
  <body
    class="flex items-center justify-center min-h-screen bg-gray-50 dark:bg-gray-950 dark:text-white"
  >
    <main class="max-w-95 w-full px-4 lg:px-0">
      <div class="text-center">
        <a
          href="#"
          title="Go to Home"
          class="inline-flex items-center gap-x-3 font-semibold text-lg text-gray-900 dark:text-white"
        >
          <svg
            class="block size-8"
            viewBox="0 0 32 32"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g>
              <path
                d="M24 0H8C3.58172 0 0 3.58172 0 8V24C0 28.4183 3.58172 32 8 32H24C28.4183 32 32 28.4183 32 24V8C32 3.58172 28.4183 0 24 0Z"
                fill="#4F46E5"
              />
              <path
                d="M10 22V16M10 16V10H22M10 16H18"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke="white"
              />
            </g>
          </svg>
          Fernway
        </a>
      </div>
      <form
        class="flex flex-col gap-6 bg-white border border-gray-900/5 rounded-2xl shadow-sm p-8 mt-8 mb-6 dark:bg-gray-900"
      >
        <h1
          class="font-bold text-gray-900 text-2xl tracking-tight dark:text-white"
        >
          Sign in to Fernway
        </h1>

        <div>
          <label
            for="email-input"
            class="block font-medium text-sm text-gray-700 dark:text-white"
          >
            Work email
          </label>
          <input
            type="email"
            name="email"
            id="email-input"
            placeholder="maya@ortizstudio.com"
            class="block bg-white border rounded-md border-gray-300 w-full shadow-sm inset-shadow-sm placeholder:text-gray-400 text-sm py-2 px-3 mt-1 dark:text-gray-400 dark:bg-gray-900"
          />
        </div>

        <div>
          <label
            for="password"
            class="block font-medium text-sm text-gray-700 dark:text-gray-300"
          >
            Password
          </label>
          <input
            type="password"
            name="password"
            id="password"
            class="block bg-white border rounded-md border-gray-300 w-full shadow-sm inset-shadow-sm text-sm py-2 px-3 mt-1 dark:text-gray-400 dark:bg-gray-900"
          />
        </div>

        <div class="flex justify-between items-center text-sm">
          <div
            class="flex items-center gap-2 font-semibold text-gray-900 dark:text-gray-200"
          >
            <input
              type="checkbox"
              name="remember"
              id="remember"
              class="accent-black"
            />
            <label for="remember">Remember me</label>
          </div>
          <a
            href="#"
            title="reset password"
            class="text-indigo-600 font-medium"
          >
            Forgot password?
          </a>
        </div>
        <div class="mt-2">
          <button
            type="submit"
            class="block py-2 px-5 rounded-full bg-indigo-600 text-white text-sm font-semibold"
          >
            Sign in
          </button>
        </div>
      </form>
      <div>
        <p
          class="text-gray-600 text-sm font-normal text-center dark:text-gray-400"
        >
          New to Fernway?
          <a
            href="#"
            title="open an account"
            class="text-indigo-600 font-medium"
          >
            Open an account
          </a>
        </p>
      </div>
    </main>
  </body>
</html>
