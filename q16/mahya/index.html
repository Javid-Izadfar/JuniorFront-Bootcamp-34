<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fernway - Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-white text-gray-900 dark:bg-gray-950 dark:text-white"
  >
    <main
      class="container mx-auto flex min-h-screen flex-col items-center justify-center px-5 py-10"
    >
      <div class="mb-8 flex items-center gap-3">
        <div
          class="flex size-12 items-center justify-center rounded-xl bg-indigo-600"
        >
          <svg
            viewBox="0 0 32 32"
            xmlns="http://www.w3.org/2000/svg"
            class="size-10"
          >
            <path
              d="M10 22V16M10 16V10H22M10 16H18"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke="white"
            />
          </svg>
        </div>
        <h1 class="text-3xl leading-5 font-bold max-sm:font-semibold">
          Fernway
        </h1>
      </div>
      <section
        class="flex w-full max-w-lg flex-col gap-6 rounded-3xl border border-gray-900/5 bg-white p-8 dark:border-transparent dark:bg-gray-900"
      >
        <h2 class="text-2xl font-bold leading-8">Sign in to Fernway</h2>
        <form class="flex flex-col gap-6">
          <div class="flex flex-col gap-2">
            <label for="email" class="text-sm font-medium leading-5">
              Work email
            </label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="maya@ortizstudio.com"
              required
              class="w-full rounded-lg border border-gray-900/10 bg-white px-4 py-3 text-sm leading-5 text-gray-900 outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 dark:border-white/20 dark:bg-gray-900 dark:text-white shadow-[0_1px_2px_#1018280D,inset_0_1px_2px_#10182814]"
            />
          </div>
          <div class="flex flex-col gap-2">
            <label for="password" class="text-sm font-medium leading-5">
              Password
            </label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="•••••"
              required
              class="w-full rounded-lg border border-gray-900/10 bg-white px-4 py-3 text-sm leading-5 text-gray-900 outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 dark:border-white/20 dark:bg-gray-900 dark:text-white shadow-[0_1px_2px_#1018280D,inset_0_1px_2px_#10182814]"
            />
          </div>
          <div class="flex flex-wrap items-center justify-between gap-4">
            <label
              class="flex cursor-pointer items-center gap-2 text-sm font-semibold leading-5"
            >
              <input
                type="checkbox"
                name="remember"
                checked
                class="size-4 cursor-pointer accent-black"
              />
              Remember me
            </label>
            <a
              href="#"
              title="forgot password"
              class="text-sm font-medium leading-5 text-indigo-600 hover:underline"
            >
              Forgot password?
            </a>
          </div>
          <button
            type="submit"
            class="self-start rounded-full bg-indigo-600 px-5 py-2 text-sm font-semibold leading-5 text-white transition hover:bg-indigo-700"
          >
            Sign in
          </button>
        </form>
      </section>
      <p
        class="mt-6 text-center text-sm leading-5 text-gray-500 dark:text-gray-300"
      >
        New to Fernway?
        <a
          href="#"
          title="open account"
          class="font-medium text-indigo-600 hover:underline"
          >Open an account</a
        >
      </p>
    </main>
  </body>
</html>
